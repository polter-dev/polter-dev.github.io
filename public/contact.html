<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marcus · Contact</title>
    <link rel="stylesheet" href="/toc.css" />
    <style>
      :root {
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --accent: #ff7a18;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 80% 5%, rgba(255, 166, 104, 0.3), transparent 45%),
          radial-gradient(circle at 15% 20%, rgba(82, 129, 255, 0.25), transparent 55%),
          linear-gradient(150deg, #05070c, #0b1020 55%, #141d2f);
        color: #111a25;
        display: flex;
        justify-content: center;
        padding: 3.5rem 1.5rem 4.5rem;
      }
      .page {
        width: min(1140px, 100%);
      }
      .shell {
        background: rgba(248, 246, 239, 0.97);
        border-radius: 34px;
        padding: 3.5rem;
        box-shadow: 0 35px 100px rgba(4, 7, 15, 0.5);
        border: 1px solid rgba(15, 23, 38, 0.08);
        display: flex;
        flex-direction: column;
        gap: 2.5rem;
      }
      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.3em;
        font-size: 0.75rem;
        color: rgba(17, 26, 37, 0.6);
        margin-bottom: 0.75rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2.1rem, 5vw, 3rem);
      }
      p {
        margin: 0;
        max-width: 720px;
        line-height: 1.65;
        color: #5d6573;
      }
      .contact-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 1.25rem;
      }
      .contact-grid.single {
        grid-template-columns: 1fr;
        max-width: 760px;
        margin: 0 auto;
      }
      .contact-card {
        padding: 1.5rem;
        border-radius: 16px;
        border: 1px solid rgba(17, 26, 37, 0.12);
        background: #ffffff;
        box-shadow: 0 16px 38px rgba(10, 15, 25, 0.08);
        min-height: 140px;
      }
      .contact-card h3 {
        margin: 0 0 0.4rem;
        font-size: 1.05rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .contact-card p {
        margin: 0;
        color: #5d6573;
        line-height: 1.55;
      }
      .social-card {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0.75rem;
      }
      .social-card p {
        color: #2a3747;
      }
      .social-links {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
      }
      .social-pill {
        padding: 0.55rem 1rem;
        border-radius: 12px;
        border: 1px solid rgba(17, 26, 37, 0.14);
        background: rgba(17, 26, 37, 0.05);
        font-weight: 600;
        letter-spacing: 0.05em;
        text-align: center;
      }
      a {
        color: #ff7a18;
        text-decoration: none;
      }
      a:hover,
      a:focus-visible {
        text-decoration: underline;
      }
      .contact-form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        margin-top: 0.5rem;
      }
      .contact-form label {
        font-size: 0.9rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #111a25;
      }
      .contact-form input,
      .contact-form textarea {
        width: 100%;
        padding: 0.9rem 1rem;
        border-radius: 12px;
        border: 1px solid rgba(17, 26, 37, 0.16);
        background: #ffffff;
        font-family: inherit;
        font-size: 1rem;
        color: #111a25;
      }
      .contact-form textarea {
        min-height: 140px;
        resize: vertical;
      }
      .contact-form button {
        align-self: flex-start;
        padding: 0.75rem 1.5rem;
        border-radius: 999px;
        border: 1px solid rgba(17, 26, 37, 0.18);
        background: linear-gradient(145deg, #111a25, #0b1521);
        color: #fdfbf7;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 0 15px 30px rgba(3, 7, 13, 0.25);
        transition: transform 150ms ease, box-shadow 150ms ease;
      }
      .contact-form button:hover,
      .contact-form button:focus-visible {
        transform: translateY(-1px);
        box-shadow: 0 20px 40px rgba(3, 7, 13, 0.3);
      }
      .fallback-links {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 0.5rem;
      }
      .fallback-links a {
        padding: 0.35rem 0.8rem;
        border-radius: 10px;
        border: 1px solid rgba(17, 26, 37, 0.14);
        background: rgba(17, 26, 37, 0.05);
        font-weight: 600;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <nav class="toc" aria-label="Site navigation">
        <a href="/">Home</a>
        <a href="/github.html">Github</a>
        <a href="/about.html">About Me</a>
        <a href="/resume.html">Resume</a>
        <a href="/contact.html" aria-current="page">Contact</a>
      </nav>

      <div class="shell">
        <section>
          <p class="eyebrow">Get in touch</p>
          <h1>Contact Me!</h1>
          <p>Use the form below to reach out.</p>
        </section>

        <form class="contact-form" id="contact-form" aria-label="Contact form">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" placeholder="Your name" required />

          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required />

          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="What would you like to discuss?" required></textarea>

          <button type="submit" aria-label="Send message">Send message</button>
        </form>
        <p class="placeholder" id="form-note">
          Submitting opens your email client with a pre-filled message. If it doesn’t work, use the options below.
        </p>
        <div class="fallback-links">
          <a href="mailto:marcusruth2003@gmail.com" target="_blank" rel="noreferrer">Open mail app</a>
          <a href="https://mail.google.com/mail/?view=cm&fs=1&to=marcusruth2003@gmail.com" target="_blank" rel="noreferrer">Open in Gmail</a>
        </div>
      </div>
    </div>
  </body>
  <script>
    const form = document.getElementById('contact-form')
    const note = document.getElementById('form-note')
    const recipient = 'marcusruth2003@gmail.com'

    if (form) {
      form.addEventListener('submit', (event) => {
        event.preventDefault()
        const nameInput = document.getElementById('name')
        const emailInput = document.getElementById('email')
        const messageInput = document.getElementById('message')

        const name = nameInput && 'value' in nameInput ? nameInput.value.trim() : ''
        const email = emailInput && 'value' in emailInput ? emailInput.value.trim() : ''
        const message = messageInput && 'value' in messageInput ? messageInput.value.trim() : ''

        if (!name || !email || !message) {
          if (note) note.textContent = 'Please fill out all fields before sending.'
          return
        }

        const subject = encodeURIComponent(`Contact from portfolio: ${name}`)
        const body = encodeURIComponent(`From: ${name} <${email}>

${message}`)
        const mailtoLink = `mailto:${recipient}?subject=${subject}&body=${body}`

        window.open(mailtoLink, '_blank')
        if (note) {
          note.textContent = 'Opening your mail app with a pre-filled message. If nothing opens, you can email me directly.'
        }
      })
    }
  </script>
</html>
