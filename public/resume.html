<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marcus · Resume</title>
    <link rel="stylesheet" href="/toc.css" />
    <link rel="stylesheet" href="/page.css" />
    <style>
      .shell {
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2.1rem, 5vw, 3rem);
      }
      p {
        margin: 0;
        max-width: 720px;
        line-height: 1.65;
        color: #5d6573;
      }
      .resume-header {
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
      }
      .resume-title {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }
      .resume-actions {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
      }
      .resume-button {
        text-decoration: none;
        padding: 0.65rem 1.3rem;
        border-radius: 999px;
        border: 1px solid rgba(17, 26, 37, 0.18);
        background: #111a25;
        color: #fdfbf7;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
        box-shadow: 0 12px 26px rgba(4, 9, 16, 0.18);
      }
      .resume-button.secondary {
        background: rgba(17, 26, 37, 0.08);
        color: #111a25;
      }
      .resume-button:hover,
      .resume-button:focus-visible {
        transform: translateY(-2px);
        box-shadow: 0 16px 34px rgba(4, 9, 16, 0.22);
      }
      .resume-viewer {
        border-radius: 20px;
        border: 1px solid rgba(17, 26, 37, 0.16);
        background: #ffffff;
        box-shadow: 0 18px 48px rgba(10, 15, 25, 0.12);
        overflow: hidden;
      }
      .resume-frame {
        width: 100%;
        height: clamp(520px, 75vh, 960px);
        border: 0;
        display: block;
      }
      .resume-fallback {
        padding: 2rem;
        text-align: center;
      }
      .resume-fallback a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }
      .resume-fallback a:hover,
      .resume-fallback a:focus-visible {
        text-decoration: underline;
      }
      @media (max-width: 720px) {
        .resume-title {
          align-items: flex-start;
        }
        .resume-button {
          width: 100%;
          text-align: center;
        }
        .resume-frame {
          height: 70vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <nav class="toc" aria-label="Site navigation">
        <a href="/">Home</a>
        <a href="/github.html">Github</a>
        <a href="/about.html">About Me</a>
        <a href="/resume.html" aria-current="page">Resume</a>
        <a href="/contact.html">Contact</a>
      </nav>

      <div class="shell">
        <section class="resume-header">
          <p class="eyebrow">Resume</p>
          <div class="resume-title">
            <h1>Marcus Ruth</h1>
            <div class="resume-actions">
              <a class="resume-button" href="/resume.pdf" download="Marcus_Ruth_Resume.pdf">Download PDF</a>
              <a class="resume-button secondary" href="/resume.tex" download="Marcus_Ruth_Resume.tex">Download .tex</a>
            </div>
          </div>
          <p>View the resume below or download your preferred format.</p>
        </section>

        <section class="resume-viewer" aria-label="Resume preview">
          <object class="resume-frame" data="/resume.pdf" type="application/pdf" aria-label="Resume PDF">
            <div class="resume-fallback">
              Resume preview unavailable. <a href="/resume.pdf" download>Download the PDF</a> instead.
            </div>
          </object>
        </section>
      </div>
    </div>
  </body>
</html>
