<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marcus · About</title>
    <link rel="stylesheet" href="/toc.css" />
    <style>
      :root {
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --accent: #ff7a18;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 80% 5%, rgba(255, 166, 104, 0.3), transparent 45%),
          radial-gradient(circle at 15% 20%, rgba(82, 129, 255, 0.25), transparent 55%),
          linear-gradient(150deg, #05070c, #0b1020 55%, #141d2f);
        color: #111a25;
        display: flex;
        justify-content: center;
        padding: 4rem 1.25rem;
      }
      .page {
        width: min(900px, 100%);
      }
      .shell {
        background: rgba(248, 246, 239, 0.97);
        border-radius: 32px;
        padding: 3.25rem;
        box-shadow: 0 45px 120px rgba(4, 7, 15, 0.55);
        border: 1px solid rgba(15, 23, 38, 0.08);
        display: flex;
        flex-direction: column;
        gap: 3rem;
      }
      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.3em;
        font-size: 0.75rem;
        color: rgba(17, 26, 37, 0.6);
        margin-bottom: 0.75rem;
      }
      .hero {
        text-align: left;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .hero h1 {
        margin: 0;
        font-size: clamp(2.4rem, 5vw, 3.2rem);
      }
      .hero p {
        margin: 0;
        max-width: 620px;
        line-height: 1.6;
        color: #5d6573;
        min-height: 3.5rem;
      }
      .values {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1.25rem;
      }
      .value-card {
        border: 1px dashed rgba(17, 26, 37, 0.2);
        border-radius: 20px;
        padding: 1.25rem;
        min-height: 150px;
        background: rgba(255, 255, 255, 0.9);
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
      }
      .value-card h2 {
        margin: 0;
        font-size: 1rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #111a25;
      }
      .value-card p {
        margin: 0;
        color: #5d6573;
        min-height: 3rem;
      }
      .placeholder {
        color: rgba(17, 26, 37, 0.45);
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <nav class="toc" aria-label="Site navigation">
        <a href="/">Home</a>
        <a href="/github.html">Github</a>
        <a href="/about.html" aria-current="page">About Me</a>
        <a href="/resume.html">Resume</a>
        <a href="/contact.html">Contact</a>
      </nav>

      <div class="shell">
        <section class="hero">
          <div>
            <p class="eyebrow">About</p>
            <h1>[Hero headline placeholder]</h1>
          </div>
          <p class="placeholder">This is where a short intro paragraph will go.</p>
        </section>

        <section>
          <p class="eyebrow">Values</p>
          <div class="values">
            <article class="value-card">
              <h2>[Value One]</h2>
              <p class="placeholder">Description placeholder.</p>
            </article>
            <article class="value-card">
              <h2>[Value Two]</h2>
              <p class="placeholder">Description placeholder.</p>
            </article>
            <article class="value-card">
              <h2>[Value Three]</h2>
              <p class="placeholder">Description placeholder.</p>
            </article>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
